name: Check KVM availability

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kvm-check:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Check CPU, RAM and KVM
        run: |
          echo "=== CPU ==="
          nproc

          echo "=== RAM ==="
          free -h

          echo "=== ARCHITECTURE ==="
          uname -m

          echo "=== VIRTUALIZATION FLAGS ==="
          grep -m1 -oE 'vmx|svm' /proc/cpuinfo | sort -u || echo "No virtualization flag"

          echo "=== KVM DEVICE ==="
          ls -l /dev/kvm 2>&1 || true

          echo "=== KVM API TEST ==="
          if [ -c /dev/kvm ]; then
            python3 -c 'import os, fcntl; fd = os.open("/dev/kvm", os.O_RDWR); print("KVM_API_VERSION =", fcntl.ioctl(fd, 0xAE00, 0)); os.close(fd)' || echo "KVM_API_TEST_FAILED"
          else
            echo "KVM_DEVICE_MISSING"
          fi
