name: KVM and Alpine Guest Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kvm-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check CPU, RAM and KVM
        run: |
          echo "========== CPU =========="
          nproc

          echo "========== RAM =========="
          free -h

          echo "========== ARCHITECTURE =========="
          uname -m

          echo "========== VIRTUALIZATION FLAGS =========="
          grep -m1 -oE '\b(vmx|svm)\b' /proc/cpuinfo || true

          echo "========== KVM DEVICE =========="
          ls -l /dev/kvm

          echo "========== KVM API =========="
          sudo python3 -c 'import os, fcntl; fd=os.open("/dev/kvm", os.O_RDWR); print("KVM_API_VERSION =", fcntl.ioctl(fd, 0xAE00, 0)); os.close(fd)'

      - name: Install QEMU and curl
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qemu-system-x86 curl

          echo "========== QEMU VERSION =========="
          qemu-system-x86_64 --version

      - name: Download Alpine Linux
        run: |
          set -e

          BASE_URL="https://dl-cdn.alpinelinux.org/alpine/v3.24/releases/x86_64/netboot-3.24.4"

          curl -fL --retry 3 "$BASE_URL/vmlinuz-virt" -o vmlinuz-virt
          curl -fL --retry 3 "$BASE_URL/initramfs-virt" -o initramfs-virt
          curl -fL --retry 3 "$BASE_URL/modloop-virt" -o modloop-virt

          echo "========== DOWNLOADED FILES =========="
          ls -lh vmlinuz-virt initramfs-virt modloop-virt

      - name: Boot Alpine Linux with KVM
        run: |
          set +e

          sudo timeout --signal=TERM --kill-after=5s 120s \
            qemu-system-x86_64 \
            -machine pc,accel=kvm \
            -cpu host \
            -m 512M \
            -kernel vmlinuz-virt \
            -initrd initramfs-virt \
            -append "modules=loop,squashfs quiet nomodeset console=ttyS0 alpine_repo=http://dl-cdn.alpinelinux.org/alpine/v3.24/main modloop=http://dl-cdn.alpinelinux.org/alpine/v3.24/releases/x86_64/netboot-3.24.4/modloop-virt" \
            -nic user,model=virtio-net-pci \
            -display none \
            -serial stdio \
            -monitor none \
            -no-reboot \
            > qemu-boot.log 2>&1

          QEMU_EXIT_CODE=$?

          set -e

          echo "========== ALPINE BOOT LOG =========="
          cat qemu-boot.log

          echo "========== CHECK BOOT RESULT =========="

          if grep -Eiq 'Welcome to Alpine Linux|localhost login:|login:' qemu-boot.log; then
            echo "ALPINE_GUEST_BOOT_OK"
          else
            echo "ALPINE_GUEST_BOOT_FAILED"
            echo "QEMU_EXIT_CODE=$QEMU_EXIT_CODE"
            exit 1
          fi

          echo "========== ALL TESTS FINISHED =========="
