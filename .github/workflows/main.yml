name: Check KVM availability

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kvm-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check CPU, RAM, KVM and QEMU
        run: |
          echo "========== CPU =========="
          nproc

          echo "========== RAM =========="
          free -h

          echo "========== ARCHITECTURE =========="
          uname -m

          echo "========== CURRENT USER =========="
          whoami
          id

          echo "========== VIRTUALIZATION FLAGS =========="
          VIRT_FLAGS=$(awk '
            /^flags[[:space:]]*:/ {
              for (i = 1; i <= NF; i++) {
                if ($i == "vmx" || $i == "svm") {
                  print $i
                }
              }
              exit
            }
          ' /proc/cpuinfo | sort -u)

          if [ -n "$VIRT_FLAGS" ]; then
            echo "$VIRT_FLAGS"
          else
            echo "NO_VIRTUALIZATION_FLAG"
          fi

          echo "========== KVM DEVICE =========="
          ls -l /dev/kvm 2>&1 || true

          echo "========== SUDO CHECK =========="
          if sudo -n true 2>/dev/null; then
            echo "SUDO_AVAILABLE"
          else
            echo "SUDO_NOT_AVAILABLE"
          fi

          echo "========== KVM API: NORMAL USER =========="
          if [ -c /dev/kvm ]; then
            if python3 -c 'import os, fcntl; fd = os.open("/dev/kvm", os.O_RDWR); print("KVM_API_VERSION =", fcntl.ioctl(fd, 0xAE00, 0)); os.close(fd)'; then
              echo "KVM_USER_ACCESS_OK"
            else
              echo "KVM_USER_ACCESS_FAILED"
            fi

            echo "========== KVM API: SUDO =========="
            if sudo -n python3 -c 'import os, fcntl; fd = os.open("/dev/kvm", os.O_RDWR); print("KVM_API_VERSION =", fcntl.ioctl(fd, 0xAE00, 0)); os.close(fd)'; then
              echo "KVM_SUDO_ACCESS_OK"
            else
              echo "KVM_SUDO_ACCESS_FAILED"
            fi
          else
            echo "KVM_DEVICE_MISSING"
          fi

          echo "========== INSTALL QEMU =========="
          sudo apt-get update -qq
          sudo apt-get install -y qemu-system-x86

          echo "========== QEMU VERSION =========="
          qemu-system-x86_64 --version

          echo "========== QEMU KVM TEST =========="
          if sudo timeout --signal=TERM 5s qemu-system-x86_64 \
            -machine pc,accel=kvm \
            -cpu host \
            -m 128M \
            -nodefaults \
            -display none \
            -S \
            -monitor none \
            -serial none \
            -parallel none; then

            echo "QEMU_STOPPED_BEFORE_TIMEOUT"
            exit 1

          else
            QEMU_EXIT_CODE=$?

            if [ "$QEMU_EXIT_CODE" -eq 124 ]; then
              echo "QEMU_KVM_START_OK"
            else
              echo "QEMU_KVM_START_FAILED"
              echo "EXIT_CODE=$QEMU_EXIT_CODE"
              exit 1
            fi
          fi

          echo "========== ALL TESTS FINISHED =========="
