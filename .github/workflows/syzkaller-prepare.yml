name: Build Syzkaller Kernel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libelf-dev \
            libssl-dev \
            libncurses-dev \
            dwarves \
            xz-utils \
            curl

      - name: Download Linux Kernel
        run: |
          set -e

          KERNEL_VERSION="6.18.63"

          curl -fL --retry 3 \
            "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${KERNEL_VERSION}.tar.xz" \
            -o linux.tar.xz

          tar -xf linux.tar.xz

          echo "KERNEL_SOURCE_READY"

      - name: Configure Kernel for Syzkaller
        run: |
          set -e

          cd linux-6.18.63

          make defconfig
          make kvm_guest.config

          # KCOV coverage
          scripts/config --enable KCOV
          scripts/config --enable KCOV_INSTRUMENT_ALL
          scripts/config --enable KCOV_ENABLE_COMPARISONS
          scripts/config --enable DEBUG_FS

          # Debian image requirements
          scripts/config --enable CONFIGFS_FS
          scripts/config --enable SECURITYFS

          # KASAN memory error detection
          scripts/config --enable KASAN
          scripts/config --enable KASAN_GENERIC
          scripts/config --enable KASAN_INLINE

          # Debug information
          scripts/config --enable DEBUG_KERNEL
          scripts/config --enable DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT
          scripts/config --enable KALLSYMS
          scripts/config --enable KALLSYMS_ALL

          # Sandbox namespaces
          scripts/config --enable CGROUPS
          scripts/config --enable NAMESPACES
          scripts/config --enable UTS_NS
          scripts/config --enable IPC_NS
          scripts/config --enable PID_NS
          scripts/config --enable NET_NS
          scripts/config --enable CGROUP_PIDS
          scripts/config --enable MEMCG
          scripts/config --enable USER_NS

          # KCOV compatibility
          scripts/config --disable RANDOMIZE_BASE

          make olddefconfig

          echo "========== REQUIRED CONFIGS =========="

          for option in KCOV KCOV_INSTRUMENT_ALL KCOV_ENABLE_COMPARISONS DEBUG_FS CONFIGFS_FS SECURITYFS KASAN KASAN_GENERIC KASAN_INLINE DEBUG_KERNEL DEBUG_INFO DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT KALLSYMS KALLSYMS_ALL; do
            if grep -qx "CONFIG_${option}=y" .config; then
              echo "OK: CONFIG_${option}=y"
            else
              echo "::error::CONFIG_${option} is not enabled"
              exit 1
            fi
          done

          echo "========== SANDBOX CONFIGS =========="

          for option in CGROUPS NAMESPACES UTS_NS IPC_NS PID_NS NET_NS CGROUP_PIDS MEMCG USER_NS; do
            grep -E "^CONFIG_${option}=|^# CONFIG_${option} is not set" .config || true
          done

          echo "========== RANDOMIZE BASE =========="

          grep -E "^CONFIG_RANDOMIZE_BASE=|^# CONFIG_RANDOMIZE_BASE is not set" .config || true

          echo "KERNEL_CONFIG_CHECK_COMPLETE"

      - name: Build Linux Kernel
        run: |
          set -e

          cd linux-6.18.63

          echo "========== BUILD START =========="

          make -j2 bzImage vmlinux

          echo "========== BUILD COMPLETE =========="

          ls -lh arch/x86/boot/bzImage
          ls -lh vmlinux

      - name: Save Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: syzkaller-linux-kernel
          include-hidden-files: true
          path: |
            linux-6.18.63/arch/x86/boot/bzImage
            linux-6.18.63/vmlinux
            linux-6.18.63/.config
          retention-days: 30
