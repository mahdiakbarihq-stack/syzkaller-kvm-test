name: Run Syzkaller Fuzz Test

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Find Latest Successful Kernel Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          response="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/syzkaller-prepare.yml/runs?branch=main&status=success&per_page=1")"

          run_id="$(python3 -c 'import json,sys; r=json.load(sys.stdin).get("workflow_runs",[]); print(r[0]["id"] if r else "")' <<< "$response")"

          if [ -z "$run_id" ]; then
            echo "::error::No successful kernel build found"
            exit 1
          fi

          echo "KERNEL_RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "Using successful kernel build: $run_id"

      - name: Download Kernel Artifact
        uses: actions/download-artifact@v4
        with:
          name: syzkaller-linux-kernel
          path: kernel-artifact
          repository: ${{ github.repository }}
          run-id: ${{ env.KERNEL_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Validate Kernel Files
        run: |
          set -euo pipefail

          test -s kernel-artifact/vmlinux
          test -s kernel-artifact/.config
          test -s kernel-artifact/arch/x86/boot/bzImage

          grep -qx 'CONFIG_KCOV=y' kernel-artifact/.config
          grep -qx 'CONFIG_KASAN=y' kernel-artifact/.config

          echo "KERNEL_ARTIFACT_VALID"

      - name: Install Dependencies
        run: |
          set -euo pipefail

          sudo apt-get update -qq

          sudo apt-get install -y \
            build-essential \
            debootstrap \
            qemu-system-x86 \
            qemu-utils \
            openssh-client

      - name: Check KVM
        run: |
          set -euo pipefail

          if [ ! -e /dev/kvm ]; then
            echo "::error::KVM is unavailable on this runner"
            exit 1
          fi

          sudo chmod a+rw /dev/kvm

          test -r /dev/kvm
          test -w /dev/kvm

          ls -l /dev/kvm
          echo "KVM_AVAILABLE"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build Syzkaller
        run: |
          set -euo pipefail

          git clone --depth=1 \
            https://github.com/google/syzkaller.git

          cd syzkaller

          GOMAXPROCS=2 make

          test -x bin/syz-manager

          echo "SYZKALLER_BUILD_COMPLETE"

      - name: Create Debian VM Image
        run: |
          set -euo pipefail

          mkdir -p image
          cd image

          bash ../syzkaller/tools/create-image.sh \
            --distribution trixie

          test -s trixie.img
          test -s trixie.id_rsa

          chmod 600 trixie.id_rsa

          echo "DEBIAN_IMAGE_READY"

      - name: Create Syzkaller Manager Config
        run: |
          set -euo pipefail

          mkdir -p workdir

          cat > manager.cfg <<EOF
          {
            "name": "linux-6.18.63-ci",
            "target": "linux/amd64",
            "http": "127.0.0.1:56741",
            "workdir": "${GITHUB_WORKSPACE}/workdir",
            "kernel_obj": "${GITHUB_WORKSPACE}/kernel-artifact",
            "image": "${GITHUB_WORKSPACE}/image/trixie.img",
            "sshkey": "${GITHUB_WORKSPACE}/image/trixie.id_rsa",
            "syzkaller": "${GITHUB_WORKSPACE}/syzkaller",
            "procs": 2,
            "type": "qemu",
            "sandbox": "namespace",
            "vm": {
              "count": 1,
              "kernel": "${GITHUB_WORKSPACE}/kernel-artifact/arch/x86/boot/bzImage",
              "cpu": 2,
              "mem": 2048,
              "cmdline": "earlyprintk=serial net.ifnames=0",
              "qemu_args": "-enable-kvm"
            }
          }
          EOF

          python3 -m json.tool manager.cfg > /dev/null

          echo "MANAGER_CONFIG_READY"

      - name: Run Syzkaller Fuzzing
        run: |
          set +e

          timeout --signal=INT --kill-after=30s 5m \
            ./syzkaller/bin/syz-manager \
            -config=manager.cfg \
            -debug 2>&1 | tee fuzz.log

          manager_status=${PIPESTATUS[0]}

          set -e

          if [ "$manager_status" -eq 124 ] || \
             [ "$manager_status" -eq 130 ]; then

            echo "FUZZING_TIME_LIMIT_REACHED"

          elif [ "$manager_status" -ne 0 ]; then

            echo "::error::Syzkaller exited with status $manager_status"
            exit "$manager_status"

          else
            echo "SYZKALLER_STOPPED"
          fi

      - name: Save Fuzzing Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: syzkaller-fuzz-results
          path: |
            fuzz.log
            manager.cfg
            workdir/crashes/
            workdir/corpus.db
          if-no-files-found: warn
          retention-days: 14
